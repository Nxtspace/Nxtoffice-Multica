name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，释放额度给其余单元。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install / typecheck / test / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依赖安装
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（占位）
        run: npm test

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: playwright 验证位
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依赖安装
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: E2E（冒烟占位）
        run: npm run e2e

      - name: 失败时上传 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results
          retention-days: 7
